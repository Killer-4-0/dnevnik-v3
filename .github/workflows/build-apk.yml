name: Сборка APK

# Запуск: вкладка Actions → «Сборка APK» → Run workflow (или автоматически при каждом пуше в main)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "apk/**"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KS_PASS: M8Ym8i1ze2hvGjZ4bUKdpZ6N
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Подготовить веб-файлы приложения
        run: |
          mkdir -p build/www
          for f in index.html manifest.webmanifest favicon.svg; do [ -e "$f" ] && cp "$f" build/www/; done
          for d in css js vendor icons art mascot; do [ -d "$d" ] && cp -r "$d" build/www/; done
          cp apk/capacitor.config.json build/
          ls build/www

      - name: Создать Android-проект (Capacitor)
        working-directory: build
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap add android
          npx cap sync android

      - name: Разрешения, версия, заставка
        working-directory: build
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # камера — для сканера штрихкодов
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' "$M"
          # номер версии растёт с каждой сборкой, чтобы APK ставился поверх старого
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          # вместо логотипа Capacitor при запуске — цвет фона приложения
          sed -i 's#@drawable/splash#@color/ic_launcher_background#' android/app/src/main/res/values/styles.xml
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Иконка приложения
        continue-on-error: true
        working-directory: build
        run: |
          IM=$(command -v magick || command -v convert)
          R=android/app/src/main/res
          declare -A S=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          declare -A F=( [mdpi]=108 [hdpi]=162 [xhdpi]=216 [xxhdpi]=324 [xxxhdpi]=432 )
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            $IM ../icons/icon-512.png -resize ${S[$d]}x${S[$d]} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
            inner=$(( ${F[$d]} * 80 / 100 ))
            $IM ../icons/icon-maskable-512.png -resize ${inner}x${inner} -background none -gravity center -extent ${F[$d]}x${F[$d]} $R/mipmap-$d/ic_launcher_foreground.png
          done
          sed -i 's/#FFFFFF/#0a1628/I' $R/values/ic_launcher_background.xml

      - name: Собрать APK
        working-directory: build/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Подписать APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=build/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" build/aligned.apk
          "$BT/apksigner" sign --ks signing/dnevnik-release.keystore --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias dnevnik --out build/Dnevnik.apk build/aligned.apk
          "$BT/apksigner" verify --verbose build/Dnevnik.apk

      - name: Сохранить APK как файл сборки
        uses: actions/upload-artifact@v4
        with:
          name: Dnevnik-apk
          path: build/Dnevnik.apk

      - name: Опубликовать в Releases (удобно скачивать с телефона)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Дневник — последний APK
          body: Свежая сборка приложения. Скачайте Dnevnik.apk и установите на телефон.
          files: build/Dnevnik.apk
