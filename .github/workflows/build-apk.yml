name: Сборка APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Build PWA assets
        run: |
          echo "PWA assets ready"

      - name: Create Android Project
        run: |
          mkdir -p twa-build/app/src/main
          cat > twa-build/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.dnevnik.health'
              compileSdk 34
              defaultConfig {
                  applicationId "com.dnevnik.health"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled true
                  }
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          cat > twa-build/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application>
                  <activity android:name="com.google.androidbrowserhelper.trusted.TrustedWebActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="https" android:host="killer-4-0.github.io"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          echo "Using existing APK from apk/ folder or creating release"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dnevnik.apk
          path: apk/Dnevnik.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          files: apk/Dnevnik.apk
          name: Release ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
